<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Theory | Pascal and Leibniz's Calculating Machines</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <div id="article-root"></div>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script src="nav.js"></script>
    <script>
      const articleData = {
        label: "Number Theory",
        title: "Pascal and Leibniz's Calculating Machines",
        description: "How mechanical devices transformed arithmetic into a new kind of engineering problem.",
        intro: "Before digital calculators, mathematicians imagined machines that could do arithmetic reliably, quickly, and without human error.",
        sections: [
          {
            id: "pascal",
            heading: "Pascal's calculator",
            items: [
              {
                title: "The Pascaline",
                text: "Blaise Pascal invented the Pascaline in the 17th century to help his father, a tax commissioner, with arithmetic. It focused mainly on addition and subtraction, but it was a breakthrough in practical computation.",
                type: "paragraph"
              },
              {
                title: "A machine for real work",
                text: "The importance of the Pascaline was not only its mechanics; it showed that calculation could be organized as a repeatable process rather than a purely human skill.",
                type: "paragraph"
              }
            ]
          },
          {
            id: "leibniz",
            heading: "Leibniz's improvement",
            items: [
              {
                title: "A richer machine",
                text: "Gottfried Wilhelm Leibniz expanded the design with a stepped drum mechanism, allowing addition, subtraction, multiplication, and division. His machine was more flexible and closer to a general-purpose calculator.",
                type: "paragraph"
              },
              {
                title: "A tragic end",
                text: "Although Leibniz's work was brilliant, he later fell out of favor and died in poverty and isolation. His life is a reminder that mathematical genius and public recognition do not always travel together.",
                type: "paragraph"
              }
            ]
          }
        ]
      };

      function renderBlocks(blocks) {
        return blocks.map((block) => {
          if (block.type === "quote") return `<blockquote class="archive-quote"><p>${block.text}</p></blockquote>`;
          if (block.type === "list") return `<ul class="archive-list">${block.items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
          if (block.type === "image") return `<figure class="archive-figure"><img src="${block.src}" alt="${block.alt || block.title}" /><figcaption>${block.title}</figcaption></figure>`;
          return `<div class="course-block mb-4"><h3>${block.title}</h3><p>${block.text}</p></div>`;
        }).join("");
      }

      function renderArticle(data) {
        const root = document.getElementById("article-root");
        if (!root) return;

        root.innerHTML = `
          <article class="essay-shell">
            <header>
              <p class="section-label">${data.label}</p>
              <h1 class="section-title">${data.title}</h1>
              <p class="section-description">${data.description}</p>
              <div class="article-divider" aria-hidden="true"></div>
            </header>
            <div class="article-body prose max-w-none">
              <p class="intro-note italic text-gray-600">${data.intro}</p>
              ${data.sections.map((section) => `
                <h2 class="archive-section-toggle cursor-pointer flex items-center justify-between select-none" onclick="toggleStory('${section.id}', this)">
                  <span>${section.heading}</span>
                  <span class="chevron text-sm text-gray-500 transition-transform duration-300" style="transform: rotate(-90deg);" aria-hidden="true">▼</span>
                </h2>
                <div id="${section.id}" class="accordion-content article-body">
                  <div class="pt-2">${renderBlocks(section.items)}</div>
                </div>
              `).join("")}
            </div>
          </article>
        `;
      }

      window.toggleStory = function (id, trigger) {
        const content = document.getElementById(id);
        const chevron = trigger?.querySelector(".chevron");
        if (!content) return;
        const isOpen = !content.classList.contains("hidden");
        content.classList.toggle("hidden", isOpen);
        content.classList.toggle("open", !isOpen);
        if (chevron) chevron.style.transform = isOpen ? "rotate(-90deg)" : "rotate(0deg)";
      };

      document.addEventListener("DOMContentLoaded", () => renderArticle(articleData));
    </script>
  </body>
</html>
