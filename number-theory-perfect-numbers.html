<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Theory | Perfect and Amicable Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <div id="article-root"></div>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script src="nav.js"></script>
    <script>
      const articleData = {
        label: "Number Theory",
        title: "Perfect Numbers, Sociable Numbers, and Amicable Numbers",
        description: "The extraordinary relationships among numbers that divide one another, balance one another, and form number cycles.",
        intro: "Number theory does not only ask what numbers are; it also studies how they relate to one another through divisors, sums, and patterns.",
        sections: [
          {
            id: "perfect",
            heading: "Perfect numbers",
            items: [
              {
                title: "The idea of a self-summing number",
                text: "A perfect number is a natural number whose proper divisors add up to itself. The classic example is 6: its proper divisors are 1, 2, and 3, and 1 + 2 + 3 = 6.",
                type: "paragraph"
              },
              {
                title: "Why they are special",
                text: "Perfect numbers feel almost mystical. They are the mathematical equivalent of a number that is exactly balanced by the pieces beneath it.",
                type: "paragraph"
              }
            ]
          },
          {
            id: "amicable",
            heading: "Amicable and sociable numbers",
            items: [
              {
                title: "Friendly pairs",
                text: "Two numbers are amicable if each is the sum of the proper divisors of the other. The pair 220 and 284 is the classic example. They are friends in the sense that each one supports the other.",
                type: "paragraph"
              },
              {
                title: "Longer chains",
                text: "A sociable number chain is a longer loop of numbers in which each number is the sum of the proper divisors of the previous one. These cycles show that divisibility creates a kind of mathematical society.",
                type: "paragraph"
              }
            ]
          },
          {
            id: "history",
            heading: "Euler and the history of discovery",
            items: [
              {
                title: "Before Euler",
                text: "Humans knew only a handful of amicable pairs for a long time. Before Leonhard Euler, the world had discovered only a few examples, and each one felt like a treasure from ancient number theory.",
                type: "paragraph"
              },
              {
                title: "Euler's dramatic breakthrough",
                text: "Euler dramatically expanded the catalog of amicable numbers, discovering 59 new pairs. His work showed that the subject was not just decorative; it was rich with structure and hidden order.",
                type: "paragraph"
              }
            ]
          }
        ]
      };

      function renderBlocks(blocks) {
        return blocks
          .map((block) => {
            if (block.type === "quote") return `<blockquote class="archive-quote"><p>${block.text}</p></blockquote>`;
            if (block.type === "list") return `<ul class="archive-list">${block.items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
            if (block.type === "image") return `<figure class="archive-figure"><img src="${block.src}" alt="${block.alt || block.title}" /><figcaption>${block.title}</figcaption></figure>`;
            return `<div class="course-block mb-4"><h3>${block.title}</h3><p>${block.text}</p></div>`;
          })
          .join("");
      }

      function renderArticle(data) {
        const root = document.getElementById("article-root");
        if (!root) return;

        root.innerHTML = `
          <article class="essay-shell">
            <header>
              <p class="section-label">${data.label}</p>
              <h1 class="section-title">${data.title}</h1>
              <p class="section-description">${data.description}</p>
              <div class="article-divider" aria-hidden="true"></div>
            </header>

            <div class="article-body prose max-w-none">
              <p class="intro-note italic text-gray-600">${data.intro}</p>

              ${data.sections
                .map(
                  (section) => `
                    <h2 class="archive-section-toggle cursor-pointer flex items-center justify-between select-none" onclick="toggleStory('${section.id}', this)">
                      <span>${section.heading}</span>
                      <span class="chevron text-sm text-gray-500 transition-transform duration-300" style="transform: rotate(-90deg);" aria-hidden="true">▼</span>
                    </h2>
                    <div id="${section.id}" class="accordion-content article-body">
                      <div class="pt-2">${renderBlocks(section.items)}</div>
                    </div>
                  `
                )
                .join("")}
            </div>
          </article>
        `;
      }

      window.toggleStory = function (id, trigger) {
        const content = document.getElementById(id);
        const chevron = trigger?.querySelector(".chevron");
        if (!content) return;
        const isOpen = !content.classList.contains("hidden");
        content.classList.toggle("hidden", isOpen);
        content.classList.toggle("open", !isOpen);
        if (chevron) chevron.style.transform = isOpen ? "rotate(-90deg)" : "rotate(0deg)";
      };

      document.addEventListener("DOMContentLoaded", () => renderArticle(articleData));
    </script>
  </body>
</html>
