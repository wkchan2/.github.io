<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Theory | Proving the Trapezoid Area Formula</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <div id="article-root"></div>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script src="nav.js"></script>
    <script>
      const articleData = {
        label: "Number Theory",
        title: "Proving the Trapezoid Area Formula by Slicing Squares",
        description: "A visual proof showing that area formulas can come from shape rearrangement and geometric intuition.",
        intro: "The standard trapezoid formula is often memorized, but it can also be discovered through slicing, moving, and rearranging pieces.",
        sections: [
          {
            id: "idea",
            heading: "A visual approach",
            items: [
              {
                title: "From square to trapezoid",
                text: "Cutting a square in half parallel to one side creates two trapezoids. By rearranging pieces, the area can be seen as a linear combination of the parallel sides and the height.",
                type: "paragraph"
              },
              {
                title: "Area as a pattern",
                text: "The formula A = (a + b)h / 2 comes from recognizing that the trapezoid is built from average-length pieces stretched across the same height. The geometry reveals the linear relationship directly.",
                type: "paragraph"
              }
            ]
          },
          {
            id: "meaning",
            heading: "Why this proof feels elegant",
            items: [
              {
                title: "Visualization over memorization",
                text: "Instead of simply applying a formula, the picture shows why the formula makes sense. This is one of the strengths of geometry: it turns algebra into an image.",
                type: "paragraph"
              }
            ]
          }
        ]
      };

      function renderBlocks(blocks) {
        return blocks.map((block) => {
          if (block.type === "quote") return `<blockquote class="archive-quote"><p>${block.text}</p></blockquote>`;
          if (block.type === "list") return `<ul class="archive-list">${block.items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
          if (block.type === "image") return `<figure class="archive-figure"><img src="${block.src}" alt="${block.alt || block.title}" /><figcaption>${block.title}</figcaption></figure>`;
          return `<div class="course-block mb-4"><h3>${block.title}</h3><p>${block.text}</p></div>`;
        }).join("");
      }

      function renderArticle(data) {
        const root = document.getElementById("article-root");
        if (!root) return;

        root.innerHTML = `
          <article class="essay-shell">
            <header>
              <p class="section-label">${data.label}</p>
              <h1 class="section-title">${data.title}</h1>
              <p class="section-description">${data.description}</p>
              <div class="article-divider" aria-hidden="true"></div>
            </header>
            <div class="article-body prose max-w-none">
              <p class="intro-note italic text-gray-600">${data.intro}</p>
              ${data.sections.map((section) => `
                <h2 class="archive-section-toggle cursor-pointer flex items-center justify-between select-none" onclick="toggleStory('${section.id}', this)">
                  <span>${section.heading}</span>
                  <span class="chevron text-sm text-gray-500 transition-transform duration-300" style="transform: rotate(-90deg);" aria-hidden="true">▼</span>
                </h2>
                <div id="${section.id}" class="accordion-content article-body">
                  <div class="pt-2">${renderBlocks(section.items)}</div>
                </div>
              `).join("")}
            </div>
          </article>
        `;
      }

      window.toggleStory = function (id, trigger) {
        const content = document.getElementById(id);
        const chevron = trigger?.querySelector(".chevron");
        if (!content) return;
        const isOpen = !content.classList.contains("hidden");
        content.classList.toggle("hidden", isOpen);
        content.classList.toggle("open", !isOpen);
        if (chevron) chevron.style.transform = isOpen ? "rotate(-90deg)" : "rotate(0deg)";
      };

      document.addEventListener("DOMContentLoaded", () => renderArticle(articleData));
    </script>
  </body>
</html>
