<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiChan | Piano</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <section class="space-y-6">
                <p class="section-label">Piano</p>
                <h1 class="section-title">Practice Log</h1>
                <p class="section-description">
                  A few pieces I can play in simplified form, along with the full versions I want to learn in the future.
                </p>
              </section>

              <section class="mt-12 piano-layout">
                <article class="piano-group">
                  <h3>Current simplified version</h3>
                  <ul class="piano-list">
                    <li>River Flows in You</li>
                    <li>Always with Me</li>
                    <li>天空之城</li>
                    <li>Cannon in C</li>
                    <li> candy wind </li>
                  </ul>
                </article>

                <article class="piano-group">
                  <h3>Full version to learn</h3>
                  <ul class="piano-list">
                    <li>Cannon in D</li>
                  </ul>
                </article>
              </section>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script src="nav.js"></script>
  </body>
</html>
