<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiChan | Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <section class="space-y-6">
                <p class="section-label">Artwork</p>
                <h1 class="section-title">Imitation</h1>
                <div class="art-intro-panel">
                  <p class="section-description art-subtitle">
                    A quiet archive of study copies of other artists' works.
                  </p>
                </div>
              </section>

              <div class="art-gallery-wrap">
                <div id="art-gallery" class="art-gallery-grid" aria-label="Copy studies gallery"></div>
              </div>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <div id="art-lightbox" class="art-lightbox" aria-hidden="true" role="dialog" aria-modal="true">
      <button class="lightbox-close" type="button" aria-label="Close artwork">✕</button>
      <div class="lightbox-panel">
        <img id="lightbox-image" src="" alt="Expanded artwork" />
      </div>
    </div>

    <script>
      const artImages = Array.from({ length: 30 }, (_, index) => `${index + 1}.jpg`);
      const gallery = document.getElementById("art-gallery");
      const lightbox = document.getElementById("art-lightbox");
      const lightboxImage = document.getElementById("lightbox-image");
      const closeButton = document.querySelector(".lightbox-close");

      artImages.forEach((fileName, index) => {
        const card = document.createElement("figure");
        card.className = "art-card";

        const img = document.createElement("img");
        img.src = `photos/copy/${fileName}`;
        img.alt = `Copy study ${index + 1}`;
        img.loading = "lazy";
        img.dataset.full = `photos/copy/${fileName}`;

        const caption = document.createElement("figcaption");
        caption.textContent = `Study ${index + 1}`;

        img.addEventListener("click", () => {
          lightboxImage.src = img.dataset.full;
          lightboxImage.alt = img.alt;
          lightbox.classList.add("is-open");
          lightbox.setAttribute("aria-hidden", "false");
          document.body.classList.add("lightbox-open");
        });

        card.appendChild(img);
        card.appendChild(caption);
        gallery.appendChild(card);
      });

      const closeLightbox = () => {
        lightbox.classList.remove("is-open");
        lightbox.setAttribute("aria-hidden", "true");
        document.body.classList.remove("lightbox-open");
      };

      closeButton.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          closeLightbox();
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && lightbox.classList.contains("is-open")) {
          closeLightbox();
        }
      });
    </script>
    <script src="nav.js"></script>
  </body>
</html>
