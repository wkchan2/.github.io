<!DOCTYPE html>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

      <div id="navbar-placeholder"></div>

      </div>

    <script src="nav.js"></script>
    <script src="article-template.js"></script>
