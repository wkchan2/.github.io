<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Theory | Phone Numbers are Prime Numbers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <div id="article-root"></div>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script src="nav.js"></script>
    <script>
      const articleData = {
        label: "Number Theory",
        title: "Phone Numbers are Prime Numbers",
        description: "How the idea of primes quietly supports the security of modern communication.",
        intro: "A phone number is just a number to a mathematician—but to number theory, it is also a chance to ask: is this number prime?",
        sections: [
          {
            id: "primes",
            heading: "Prime numbers as building blocks",
            items: [
              {
                title: "What makes a number prime?",
                text: "A prime number is a whole number greater than 1 whose only positive divisors are 1 and itself. Primes are the atoms of arithmetic because every whole number can be broken into a product of primes.",
                type: "paragraph"
              },
              {
                title: "A surprising frequency",
                text: "The Prime Number Theorem tells us that the probability that a large random number is prime is roughly inversely proportional to its size. This is one reason large primes are so useful in mathematics and computing.",
                type: "paragraph"
              }
            ]
          },
          {
            id: "cryptography",
            heading: "Why primes matter in the real world",
            items: [
              {
                title: "Encryption and public keys",
                text: "Modern cryptography, such as RSA, depends on the difficulty of factoring very large composite numbers that are built from two enormous primes. The security of digital communication relies on this hidden number-theory problem.",
                type: "paragraph"
              },
              {
                title: "A practical miracle",
                text: "The fact that multiplying two large primes is easy, but undoing the multiplication is hard, is the foundation of secure online communication. Number theory is not just abstract—it protects everyday life.",
                type: "paragraph"
              }
            ]
          }
        ]
      };

      function renderBlocks(blocks) {
        return blocks
          .map((block) => {
            if (block.type === "quote") return `<blockquote class="archive-quote"><p>${block.text}</p></blockquote>`;
            if (block.type === "list") return `<ul class="archive-list">${block.items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
            if (block.type === "image") return `<figure class="archive-figure"><img src="${block.src}" alt="${block.alt || block.title}" /><figcaption>${block.title}</figcaption></figure>`;
            return `<div class="course-block mb-4"><h3>${block.title}</h3><p>${block.text}</p></div>`;
          })
          .join("");
      }

      function renderArticle(data) {
        const root = document.getElementById("article-root");
        if (!root) return;

        root.innerHTML = `
          <article class="essay-shell">
            <header>
              <p class="section-label">${data.label}</p>
              <h1 class="section-title">${data.title}</h1>
              <p class="section-description">${data.description}</p>
              <div class="article-divider" aria-hidden="true"></div>
            </header>

            <div class="article-body prose max-w-none">
              <p class="intro-note italic text-gray-600">${data.intro}</p>

              ${data.sections
                .map(
                  (section) => `
                    <h2 class="archive-section-toggle cursor-pointer flex items-center justify-between select-none" onclick="toggleStory('${section.id}', this)">
                      <span>${section.heading}</span>
                      <span class="chevron text-sm text-gray-500 transition-transform duration-300" style="transform: rotate(-90deg);" aria-hidden="true">▼</span>
                    </h2>
                    <div id="${section.id}" class="accordion-content article-body">
                      <div class="pt-2">${renderBlocks(section.items)}</div>
                    </div>
                  `
                )
                .join("")}
            </div>
          </article>
        `;
      }

      window.toggleStory = function (id, trigger) {
        const content = document.getElementById(id);
        const chevron = trigger?.querySelector(".chevron");
        if (!content) return;
        const isOpen = !content.classList.contains("hidden");
        content.classList.toggle("hidden", isOpen);
        content.classList.toggle("open", !isOpen);
        if (chevron) chevron.style.transform = isOpen ? "rotate(-90deg)" : "rotate(0deg)";
      };

      document.addEventListener("DOMContentLoaded", () => renderArticle(articleData));
    </script>
  </body>
</html>
