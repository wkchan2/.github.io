<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number Theory | Euler and the Derangement Problem</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <div id="article-root"></div>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

    <script src="nav.js"></script>
    <script>
      const articleData = {
        label: "Number Theory",
        title: "Euler, Derangements, and Mating",
        description: "What can a random matching game teach us about finding a partner?",
        intro: "Imagine a finite group of people with a fixed list of possible matches. If everyone is randomly assigned one intended partner, what is the chance that nobody receives the match meant for them?",
        sections: [
          {
            id: "idea",
            heading: "The setup",
            items: [
              {
                title: "A random mating game",
                text: "Suppose four people each have one intended match. We shuffle the names and give one name to each person. A derangement happens when everyone gets a different name from the one intended for them. This is a mathematical matching game, not a prediction about real relationships.",
                type: "paragraph"
              },
              {
                title: "A four-person example",
                text: "With four people, there are 4! = 24 possible assignments. Exactly 9 of them give nobody their intended match, so the probability is 9/24 = 37.5%. Even this small example is already very close to the famous 37% result.",
                type: "paragraph"
              },
              {
                title: "The 37% pattern",
                text: "As the group becomes larger, the chance of a complete mismatch approaches 1/e, which is about 0.3679. In other words, it stays close to 37%, while the chance of at least one match is about 63%.",
                type: "paragraph"
              }
            ]
          },
          {
            id: "why",
            heading: "Why it matters",
            items: [
              {
                title: "What mating has to do with mathematics",
                text: "The word mating makes the problem feel personal, but Euler's mathematics is really studying a carefully controlled matching experiment. We assume a finite group, one fixed list of intended matches, and a completely random assignment. These rules let us calculate what can happen instead of guessing from personal experience.",
                type: "paragraph"
              },
              {
                title: "What the 37% really means",
                text: "The 37% does not mean that a person has a 37% chance of finding a partner in real life. Real relationships are not random assignments, and people do not have only one possible match. It means that, under these simplified rules, a large random matching has about a 37% chance of producing no intended matches at all.",
                type: "paragraph"
              },
              {
                title: "Why probability surprises us",
                text: "Adding more people does not make a complete mismatch almost impossible. The probability settles near the same value, 37%. The same idea appears in classroom partner activities, gift exchanges, secret friends, and other situations where people or objects are randomly assigned.",
                type: "paragraph"
              }
            ]
          }
        ]
      };

      function renderBlocks(blocks) {
        return blocks
          .map((block) => {
            if (block.type === "quote") return `<blockquote class="archive-quote"><p>${block.text}</p></blockquote>`;
            if (block.type === "list") return `<ul class="archive-list">${block.items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
            if (block.type === "image") return `<figure class="archive-figure"><img src="${block.src}" alt="${block.alt || block.title}" /><figcaption>${block.title}</figcaption></figure>`;
            return `<div class="course-block mb-4"><h3>${block.title}</h3><p>${block.text}</p></div>`;
          })
          .join("");
      }

      function renderArticle(data) {
        const root = document.getElementById("article-root");
        if (!root) return;

        root.innerHTML = `
          <article class="essay-shell">
            <header>
              <p class="section-label">${data.label}</p>
              <h1 class="section-title">${data.title}</h1>
              <p class="section-description">${data.description}</p>
              <div class="article-divider" aria-hidden="true"></div>
            </header>

            <div class="article-body prose max-w-none">
              <p class="intro-note italic text-gray-600">${data.intro}</p>

              ${data.sections
                .map(
                  (section) => `
                    <h2 class="archive-section-toggle cursor-pointer flex items-center justify-between select-none" onclick="toggleStory('${section.id}', this)">
                      <span>${section.heading}</span>
                      <span class="chevron text-sm text-gray-500 transition-transform duration-300" style="transform: rotate(-90deg);" aria-hidden="true">▼</span>
                    </h2>
                    <div id="${section.id}" class="accordion-content article-body">
                      <div class="pt-2">${renderBlocks(section.items)}</div>
                    </div>
                  `
                )
                .join("")}
            </div>
          </article>
        `;
      }

      window.toggleStory = function (id, trigger) {
        const content = document.getElementById(id);
        const chevron = trigger?.querySelector(".chevron");
        if (!content) return;
        const isOpen = !content.classList.contains("hidden");
        content.classList.toggle("hidden", isOpen);
        content.classList.toggle("open", !isOpen);
        if (chevron) chevron.style.transform = isOpen ? "rotate(-90deg)" : "rotate(0deg)";
      };

      document.addEventListener("DOMContentLoaded", () => renderArticle(articleData));
    </script>
  </body>
</html>
