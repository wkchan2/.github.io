<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WikiChan | Blog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="nav.js"></script>
  </head>
  <body>
    <div class="page-shell">
      <div id="navbar-placeholder"></div>

      <div class="reference-shell">
        <div class="reference-grid">
          <div class="shadow-band" aria-hidden="true"></div>

          <main class="main-panel">
            <div class="inner">
              <section class="space-y-6">
                <h1 class="section-title">Stories to read</h1>
                <p class="section-description">
                   Stories to read when you don't know what book to read
                </p>
              </section>
              <section class="mt-12 piano-layout">
                <article class="piano-group">
                  <h3>Books</h3>
                  
                  <!-- Made 墨說 an h3 tag to match the font/style of 魔塔 -->
                  <h3>
                    <a class="piano-list" href="https://www.shikoto.com/authors/2208.html" target="_blank">墨說</a>
                  </h3>
                  <p>really good stories, the joy of reading Hong Kong based stories</p>

                  <ul class="piano-list mt-4">
                    <li>
                      <strong>魔法學園 1-5</strong>
                      <span class="text-xs text-gray-500 ml-1">（譯者：注芃）</span>
                    </li>
                    <p>經典魔法冒險系列故事</p>
                  </ul>
                </article>
                
                <article class="piano-group">
                  <h3>Non books</h3>
                  <h3> 魔塔 </h3>
                  <ul class="piano-list">
                    <li><a href=" https://www.bilibili.com/video/BV1w54y1U7WP/?share_source=copy_web" target="_blank">永不复還</a></li>
                    <p> 爽文修仙劇情，但是更有少年熱血 </p>
                    <li> <a href="https://www.bilibili.com/video/BV1HE411Z7Nw/?share_source=copy_web" target="_blank">宿命的旋律</a></li>
                    <p>不怎麼強的勇者不惜一切也要守護妖精的愛情故事</p>
                  </ul>
                </article>
              </section>
            </div>
          </main>

          <div class="shadow-band right" aria-hidden="true"></div>
        </div>
      </div>
    </div>

  </body>
</html>
